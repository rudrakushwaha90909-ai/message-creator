<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Message Creator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css"
    rel="stylesheet"
  >

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      margin: 0;
      padding: 20px;
    }

    h1.page-title {
      text-align: center;
      color: #d6336c;
    }

    .toolbar {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }

    .toolbar button,
    .toolbar select,
    .toolbar input[type="color"] {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #ffd6e0;
      cursor: pointer;
      font-size: 14px;
    }

    .toolbar button:hover,
    .upload-label:hover {
      background: #ff9eb5;
    }

    .upload-label {
      cursor: pointer;
      background: #ffd6e0;
      padding: 6px 10px;
      border-radius: 6px;
    }

    #canvas-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      min-height: 500px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      padding: 30px;
      position: relative;
    }

    #editor {
      min-height: 400px;
      outline: none;
      font-size: 16px;
      line-height: 1.5;
    }

    #editor img {
      max-width: 100%;
      display: block;
      margin: 10px auto;
      border-radius: 8px;
    }

    .actions {
      max-width: 900px;
      margin: 20px auto;
      text-align: center;
    }

    .actions button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #d6336c;
      color: white;
      cursor: pointer;
      margin: 0 8px;
    }

    .actions button:hover {
      background: #ad1457;
    }

    #cropModal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    #cropModal .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
    }

    #cropImage {
      max-width: 70vw;
      max-height: 60vh;
      display: block;
    }

    .modal-buttons {
      margin-top: 15px;
      text-align: center;
    }

    .modal-buttons button {
      padding: 8px 16px;
      margin: 6px;
      border: none;
      border-radius: 6px;
      background: #d6336c;
      color: white;
      cursor: pointer;
    }

    .modal-buttons button:hover {
      background: #ad1457;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }

      #canvas-container {
        padding: 18px;
      }

      .toolbar {
        gap: 7px;
      }

      .actions button {
        margin: 5px;
      }
    }
  </style>
</head>

<body>

  <h1 class="page-title">🎂 Happy Birthday Message Creator 🎂</h1>

  <div class="toolbar">
    <select id="fontName" onchange="format('fontName', this.value)">
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Comic Sans MS">Comic Sans</option>
      <option value="Courier New">Courier New</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Verdana">Verdana</option>
      <option value="Impact">Impact</option>
      <option value="Tahoma">Tahoma</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
    </select>

    <select id="fontSize" onchange="format('fontSize', this.value)">
      <option value="1">Small</option>
      <option value="3" selected>Normal</option>
      <option value="5">Large</option>
      <option value="6">X-Large</option>
      <option value="7">Huge</option>
    </select>

    <select onchange="formatHeading(this.value)">
      <option value="P">Normal Text</option>
      <option value="H1">Heading 1</option>
      <option value="H2">Heading 2</option>
      <option value="H3">Sub Heading</option>
    </select>

    <input type="color" id="textColor" value="#000000"
           onchange="format('foreColor', this.value)" title="Text Color">

    <input type="color" id="bgColor" value="#ffff00"
           onchange="format('hiliteColor', this.value)" title="Highlight Color">

    <button type="button" onclick="format('bold')"><b>B</b></button>
    <button type="button" onclick="format('italic')"><i>I</i></button>
    <button type="button" onclick="format('underline')"><u>U</u></button>

    <button type="button" onclick="format('justifyLeft')">Left</button>
    <button type="button" onclick="format('justifyCenter')">Center</button>
    <button type="button" onclick="format('justifyRight')">Right</button>

    <button type="button" onclick="format('insertUnorderedList')">List</button>

    <label class="upload-label">
      🖼 Upload Image
      <input
        type="file"
        id="imgUpload"
        accept="image/*"
        style="display:none"
      >
    </label>
  </div>

  <div id="canvas-container">
    <div id="editor" contenteditable="true">
      <h1 style="text-align:center;">🎉 Happy Birthday! 🎉</h1>
      <p style="text-align:center;">
        Click here and start typing your beautiful birthday message...
      </p>
    </div>
  </div>

  <div class="actions">
    <button type="button" onclick="downloadAsImage()">📥 Download as Image</button>
    <button type="button" onclick="clearEditor()">🗑 Clear</button>
  </div>

  <div id="cropModal">
    <div class="modal-content">
      <img id="cropImage" alt="Crop preview">

      <div class="modal-buttons">
        <button type="button" onclick="rotateImage(-90)">⟲ Rotate Left</button>
        <button type="button" onclick="rotateImage(90)">⟳ Rotate Right</button>
        <button type="button" onclick="applyCrop()">✅ Insert Image</button>
        <button type="button" onclick="closeCropModal()">❌ Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script>
    function format(command, value) {
      if (value === undefined) value = null;

      document.getElementById("editor").focus();
      document.execCommand(command, false, value);
    }

    function formatHeading(tag) {
      document.getElementById("editor").focus();
      document.execCommand("formatBlock", false, tag);
    }

    let cropper = null;

    const imgUpload = document.getElementById("imgUpload");
    const cropModal = document.getElementById("cropModal");
    const cropImage = document.getElementById("cropImage");
    const editor = document.getElementById("editor");

    imgUpload.addEventListener("change", function (event) {
      const file = event.target.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please select an image file.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function (e) {
        cropImage.src = e.target.result;
        cropModal.style.display = "flex";

        if (cropper) {
          cropper.destroy();
        }

        cropper = new Cropper(cropImage, {
          aspectRatio: NaN,
          viewMode: 1,
          autoCropArea: 1,
          responsive: true
        });
      };

      reader.readAsDataURL(file);

      // Allow the same image to be selected again later.
      imgUpload.value = "";
    });

    function rotateImage(degrees) {
      if (cropper) {
        cropper.rotate(degrees);
      }
    }

    function applyCrop() {
      if (!cropper) return;

      const canvas = cropper.getCroppedCanvas({
        maxWidth: 800,
        maxHeight: 800,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: "high"
      });

      if (!canvas) {
        alert("Could not crop this image.");
        return;
      }

      const dataUrl = canvas.toDataURL("image/png");

      editor.focus();
      document.execCommand("insertImage", false, dataUrl);

      closeCropModal();
    }

    function closeCropModal() {
      cropModal.style.display = "none";

      if (cropper) {
        cropper.destroy();
        cropper = null;
      }

      cropImage.src = "";
    }

    function clearEditor() {
      const confirmed = confirm("Clear entire message?");

      if (confirmed) {
        editor.innerHTML =
          '<h1 style="text-align:center;">🎉 Happy Birthday! 🎉</h1>' +
          '<p style="text-align:center;">Start typing...</p>';
      }
    }

    function downloadAsImage() {
      html2canvas(editor, {
        scale: 2,
        useCORS: true,
        backgroundColor: "#ffffff"
      }).then(function (canvas) {
        const link = document.createElement("a");

        link.download = "birthday-message.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(function (error) {
        console.error(error);
        alert("Sorry, the image could not be downloaded.");
      });
    }
  </script>

</body>
</html>
